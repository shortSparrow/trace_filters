<!DOCTYPE html>
<html>
<body style="background: #1a1a1a; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden;">

<canvas id="displayCanvas"></canvas>

<script>
const canvas = document.getElementById('displayCanvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const offCanvas = document.createElement('canvas');
const offCtx = offCanvas.getContext('2d');

// --- НАЛАШТУВАННЯ ---
const RADIUS = 80; 
const ITERATIONS = 4; // Кількість проходів блюру (чим більша ти більший блюр, але і довше опрацьовує)
const BORDER_WIDTH = 2;
const DIAMETER = RADIUS * 2;

// Матриця Гауса 5x5
const kernel = [
    [1/256, 4/256, 6/256, 4/256, 1/256],
    [4/256, 16/256, 24/256, 16/256, 4/256],
    [6/256, 24/256, 36/256, 24/256, 6/256],
    [4/256, 16/256, 24/256, 16/256, 4/256],
    [1/256, 4/256, 6/256, 4/256, 1/256]
];

let prevX = 0, prevY = 0;
let originalData = null;

const img = new Image();
img.crossOrigin = "anonymous";
img.src = 'https://picsum.photos/id/28/1000/700';

img.onload = () => {
    canvas.width = offCanvas.width = img.width;
    canvas.height = offCanvas.height = img.height;
    offCtx.drawImage(img, 0, 0);
    ctx.drawImage(img, 0, 0);
    // Зберігаємо оригінальні пікселі для математики
    originalData = offCtx.getImageData(0, 0, img.width, img.height);
};

/**
 * працює прямо з масивом джерела через індекси для швидкості
 */
function multiple_pixel_on_kernel(targetX, targetY, sourceWidth, sourcePixels) {
    let r = 0, g = 0, b = 0;
    const gap = 2; // для ядра 5x5

    for (let i = 0; i < 5; i++) {
        for (let j = 0; j < 5; j++) {
            const curX = targetX - gap + j;
            const curY = targetY - gap + i;
            
            // Тепер отримаємо реальний індекс з sourcePixels
            const idx = (curY * sourceWidth + curX) * 4;
            const weight = kernel[i][j];

            r += sourcePixels[idx] * weight;
            g += sourcePixels[idx + 1] * weight;
            b += sourcePixels[idx + 2] * weight;
        }
    }
    return [r, g, b];
}

/**
 * Обробка кола
 */
function processCircle(mouseX, mouseY) {
    const output = ctx.createImageData(DIAMETER, DIAMETER);
    const startX = Math.floor(mouseX - RADIUS);
    const startY = Math.floor(mouseY - RADIUS);

    
  // 2. Отримуємо дані одним махом
    const imageData = offCtx.getImageData(startX, startY, DIAMETER, DIAMETER);
    let currentPixels = imageData.data;
    // console.log('currentPixels: ', currentPixels)


    // Ітерації блюру
    for (let it = 0; it < ITERATIONS; it++) {
        const nextBuffer = new Uint8ClampedArray(currentPixels);
        for (let ly = 2; ly < DIAMETER - 2; ly++) {
            for (let lx = 2; lx < DIAMETER - 2; lx++) {
                const dx = lx - RADIUS;
                const dy = ly - RADIUS;

                if (dx * dx + dy * dy <= RADIUS * RADIUS) {
                    const [r, g, b] = multiple_pixel_on_kernel(lx, ly, DIAMETER, currentPixels);
                    const idx = (ly * DIAMETER + lx) * 4;
                    nextBuffer[idx] = r;
                    nextBuffer[idx + 1] = g;
                    nextBuffer[idx + 2] = b;
                }
            }
        }
        currentPixels = nextBuffer;
    }

    output.data.set(currentPixels);
    return output;
}

canvas.addEventListener('mousemove', (e) => {
    if (!originalData) return;

    const rect = canvas.getBoundingClientRect();
    const x = Math.floor(e.clientX - rect.left);
    const y = Math.floor(e.clientY - rect.top);

    // 1. ОЧИСТКА (Відновлення оригіналу на місці попереднього кадру)
    const cleanR = RADIUS + BORDER_WIDTH + 1;
    ctx.drawImage(offCanvas, 
        prevX - cleanR, prevY - cleanR, cleanR * 2, cleanR * 2, 
        prevX - cleanR, prevY - cleanR, cleanR * 2, cleanR * 2
    );

    // 2. МАЛЮВАННЯ БЛЮРУ
    const blurredData = processCircle(x, y);
    ctx.putImageData(blurredData, x - RADIUS, y - RADIUS);

    // 3. МАЛЮВАННЯ БОРДЕРА
    ctx.beginPath();
    ctx.arc(x, y, RADIUS, 0, Math.PI * 2);
    ctx.strokeStyle = 'white';
    ctx.lineWidth = BORDER_WIDTH;
    ctx.stroke();

    // Оновлюємо координати для наступної очистки
    prevX = x;
    prevY = y;
});

</script>
</body>
</html>
