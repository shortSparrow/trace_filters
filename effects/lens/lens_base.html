<!DOCTYPE html>
<html>
<body style="background: #1a1a1a; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh;">
    <canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const RADIUS = 80;

    const img = new Image();
    img.crossOrigin = "anonymous";
    img.src = 'https://picsum.photos/id/28/1000/700';

    img.onload = () => {
        canvas.width = img.width;
        canvas.height = img.height;

        // 1. Малюємо оригінальне зображення як фоновий шар
        const offscreenCanvas = document.createElement('canvas');
        offscreenCanvas.width = img.width;
        offscreenCanvas.height = img.height;
        const offCtx = offscreenCanvas.getContext('2d');
        offCtx.drawImage(img, 0, 0);

        // Отримуємо сирі пікселі (RGBA)
        const srcData = offCtx.getImageData(0, 0, img.width, img.height);
        
        let mouseX = -1000, mouseY = -1000;

        canvas.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect();
            mouseX = Math.floor(e.clientX - rect.left);
            mouseY = Math.floor(e.clientY - rect.top);
            renderLens(mouseX, mouseY);
        });

        function renderLens(mX, mY) {
            
            // Спочатку малюємо чисте зображення (можна зробити як у blur де ми перемальовуємо лише те що змінилося,
            // але це може бути повільніше, бо drawImage виконується саме на відеокарті. Загалом нам різниці
            // немає, тож для різноманіття і чистоти, нехай тут буде через весь drawImage() )
            ctx.drawImage(offscreenCanvas, 0, 0);

            // Визначаємо область для оновлення (квадрат навколо миші)
            const startX = Math.max(0, mX - RADIUS - 2);
            const startY = Math.max(0, mY - RADIUS - 2);
            const endX = Math.min(img.width, mX + RADIUS + 2);
            const endY = Math.min(img.height, mY + RADIUS + 2);
            const width = endX - startX;
            const height = endY - startY;

            if (width <= 0 || height <= 0) return;

            const outputData = ctx.getImageData(startX, startY, width, height);
            const outPixels = outputData.data;
            const srcPixels = srcData.data;

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const currentX = startX + x;
                    const currentY = startY + y;

                    const dx = currentX - mX;
                    const dy = currentY - mY;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    const outIndex = (y * width + x) * 4;

                    // Зона всередині линзи
                    if (dist < RADIUS) {
                        /**
                         * Нам потрібна формула яка буде маніпулювати пікселями так само як і лінза, чим ближче до центру
                         * ти менше викривлення, а чим далі від центру до окраїн ти більше викривлення.
                         * Справжня формула для лінзи із фізики працює із кутами падіння та відбиття, у нас такого немає 
                         * (ми не розглядаємо трасування променів), тому ви скористаємося певною апроксимацією.
                         * У нас є чудове рівняння сфери у тривимірному просторі:
                         *  x^2 + y^2 + z^2 = 1 
                         * 
                         * Нехай y - це висота, тоді поставимо сферу в центр по y (тобто y=0). Тоді матимемо
                         * x^2 + z^2 = 1
                         * Відстань від центру лінзи на площині d = sqrt(x^2 + y^2)
                         * 
                         * Тоді матимемо
                         * d^2 + z^2 = 1
                         * z = sqrt(1 - d^2)
                         * Тут z — це висота купола лінзи над точкою d.
                         * Тут d = distance/radius - нормалізована відстань від центру (від 0 до 1). Наш radius - це
                         * максимальна відстань, тож якщо distance теж максимальне то отримаємо radius/radius = 1
                         * 
                         * У самому центрі лінзи (d=0) лінза буде найтовщою z=sqrt(1-0)=1
                         * На краю лінза найтонша (d=1) => z=sqrt(1-1)=0
                         * 
                         * Формула distortion виражає прогин (викривлення) лінзи 
                         * distortion = 1 - z = 1 - sqrt(1 - d^2)
                         * Вона описує, наскільки сильно поверхня лінзи «нахиляється» відносно плоского зображення під нею 
                         * Для центру буде 
                         *      distortion = 1 - z = 1 - sqrt(1-0) = 1 - 1 = 0 (зсув пікселів дорівнює 0, зображення не змінюється)
                         * Для краю буде
                         *      distortion = 1 - z = 1 - sqrt(1-1) = 1 - 0 = 1 (зсув максимальний)
                         * 
                         * Тобто як підсумок можна сказати, що реальна лінза (чи крапля води) має зображення зсунуте за законом заломлення 
                         * Снеліуса, але в комп'ютерній графіці щоб не робити складні обчислення ми використовуємо сферичне наближення  
                         * 
                         * 
                         * 
                         * Сила зсуву пікселів (вектор від центру до поточного пікселя * коефіцієнт)
                         * const shiftX = dx * distortion * 0.5;
                         * const shiftY = dy * distortion * 0.5;
                         * Ці два рядки визначають, на скільки пікселів і в якому напрямку потрібно зміститися від поточної 
                         * точки, щоб прочитати «заломлений» колір із фонового зображення.
                         * dx чи dy - це наш вектор, тобто одна конкретна точка в межах нашої лінзи
                         * 0.5 - це коефіцієнт оптичної сили (Refraction Factor). Константа, яка задає «заломлюючу здатність»
                         * нашого віртуального скла. Якщо поставити 0.2, оптичний ефект буде слабшим (пласкіше скло), 
                         * якщо 1.0 — викривлення буде дуже агресивним.
                         * 
                         * 
                         */

                        const normDist = dist / RADIUS;

                        // 1. Формула сферичного прогину (0 у центрі, 1 на краї, тобто значення від 0.0 до 1.0)
                        const distortion = 1 - Math.sqrt(1 - normDist * normDist);

                        /**
                         * 2. Сила зсуву пікселів (вектор від центру до поточного пікселя * коефіцієнт) 
                         * 
                         * distortion * 0.5 буде у значеннях від 1.0 * 0.5 = 0.5 до 0.0 * 0.5 = 0.0
                         * тобто ми не вийдемо за межі радіусу, тож це просто невеликий коефіцієнт посилення від 0.0 до 0.5, чим більший
                         * shiftX чи shiftY тим більше ефект лінзи
                         */
                        const shiftX = dx * distortion * 0.5; 
                        const shiftY = dy * distortion * 0.5;

                        /**
                         * 3. Звідки беремо колір (зсуваємося ближче до центру)
                         * 
                         * currentX - shiftX: Обчислюємо нову дробову координату, зсунуту в бік центру лінзи.
                         * 
                         * Math.round(...): Округлюємо дробове число до найближчого цілого пікселя (у варіанті без білінійної інтерполяції).
                         * 
                         * Math.max(0, ...): Гарантує, що координата не буде меншою за 0 (захист від виходу за лівий/верхній край картинки).
                         * 
                         * Math.min(..., img.width - 1): Гарантує, що координата не перевищить максимальний індекс img.width - 1
                         * (захист від виходу за правий/нижній край).
                         */
                        const sampleX = Math.min(Math.max(0, Math.round(currentX - shiftX)), img.width - 1);
                        const sampleY = Math.min(Math.max(0, Math.round(currentY - shiftY)), img.height - 1);

                        const srcIndex = (sampleY * img.width + sampleX) * 4;

                        // 4. Копіюємо RGB без змін
                        outPixels[outIndex]     = srcPixels[srcIndex];
                        outPixels[outIndex + 1] = srcPixels[srcIndex + 1];
                        outPixels[outIndex + 2] = srcPixels[srcIndex + 2];
                        outPixels[outIndex + 3] = 255;
                    }
                }
            }

            // 1. Малюємо оброблені пікселі назад на канвас
            ctx.putImageData(outputData, startX, startY);

            // 2. Векторне малювання білої обводки навколо лінзи з апаратним згладжуванням (Anti-Aliasing)
            ctx.beginPath();
            ctx.arc(mX, mY, RADIUS, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.lineWidth = 1.5;
            ctx.stroke();
        }

        // Початковий рендер
        ctx.drawImage(offscreenCanvas, 0, 0);
    };
</script>
</body>
</html>
